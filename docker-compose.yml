services:
  dfd:
    build: .
    image: deepfake-detektor:latest
    restart: unless-stopped
    ports:
      - "${DFD_PORT:-8000}:8000"
    env_file:
      - path: .env
        required: false
    volumes:
      - dfd-data:/data
    # Hardening: the application only ever writes to /data and /tmp.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 4g
    stop_grace_period: 20s

volumes:
  dfd-data:
