[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dfd"
version = "0.1.0"
description = "Deepfake detection system: image, video and audio forensics with a FastAPI web interface."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "eliot" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "argon2-cffi>=23.1",
  "pyjwt>=2.8",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "onnxruntime>=1.22,<2",
  "pillow>=10.3",
  "opencv-python-headless>=4.9,<5",
  "torch>=2.2",
  "timm>=1.0.12",
  "imageio-ffmpeg>=0.5",
  "fpdf2>=2.8",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
]
train = ["soundfile>=0.12", "matplotlib>=3.8"]
kaggle = ["kaggle>=1.7"]

[project.scripts]
dfd = "dfd.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/dfd"]
# The face detector is ignored by the generic "*.onnx" rule in .gitignore; ship it anyway.
artifacts = ["src/dfd/infrastructure/media/assets/*.onnx"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "training", "scripts"]
extend-exclude = ["src/dfd/infrastructure/ml/vendor", "kaggle/_build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PL", "RUF"]
ignore = [
  "PLR0913", "PLR0917", # many arguments are fine for composition roots and dataclasses
  "PLR2004", # magic numbers in tests and signal processing
  "RUF001", "RUF002", "RUF003", # Turkmen/Russian text is intentional
  "B008",    # FastAPI Depends() in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0915", "PLR0912"]
"training/**" = ["PLR0915", "PLR0912"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["dfd"]
strict = true
warn_unused_ignores = true
exclude = ["src/dfd/infrastructure/ml/vendor"]

[[tool.mypy.overrides]]
module = ["onnxruntime.*", "cv2.*", "timm.*", "fpdf.*", "imageio_ffmpeg.*", "argon2.*", "dfd.infrastructure.ml.vendor.*"]
ignore_missing_imports = true
ignore_errors = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["dfd"]
omit = ["*/vendor/*"]
